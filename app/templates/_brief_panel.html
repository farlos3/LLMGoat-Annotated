{% if challenge.brief %}
<aside class="brief-panel">
  <h3>Your Mission</h3>
  <p>{{ challenge.brief.scenario }}</p>
  <ol>
    {% for objective in challenge.brief.objectives %}
    <li>{{ objective }}</li>
    {% endfor %}
  </ol>
  {% if challenge.brief.hint %}
  <details>
    <summary>Hint (click to reveal)</summary>
    <p>{{ challenge.brief.hint }}</p>
  </details>
  {% endif %}
</aside>
{% endif %}
